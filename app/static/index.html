<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Поиск по законодательству РК</title>
<style>
  :root { --bg:#FFFFFF; --soft:#F5F4FF; --card:#FFFFFF; --ink:#16162A; --mute:#6B6B85; --line:#E4E3F5; --acc:#5B4BFF; --acc-dark:#4535D9; --acc-soft:#ECE9FF; --coral:#FF6B5B; --teal:#12B5A0; --sun:#FFB800;
          --warn-bg:#FFF6DB; --warn-ink:#8A5A00; --info-bg:#E8F0FF; --info-ink:#1F4BB8; --bad:#C0352B; --ok-bg:#DDF7F1; --ok-ink:#0B7A69; }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "Inter","Segoe UI",system-ui,sans-serif; }
  .top { position:sticky; top:0; z-index:20; background:rgba(255,255,255,.92); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .top-in { max-width:1120px; margin:0 auto; padding:10px 24px; display:flex; align-items:center; gap:24px; }
  .logo { font-weight:800; font-size:20px; letter-spacing:-.3px; color:var(--ink); text-decoration:none; display:flex; align-items:center; gap:8px; }
  .logo b { display:inline-grid; place-items:center; width:30px; height:30px; border-radius:9px; background:linear-gradient(135deg,var(--acc),var(--coral)); color:#fff; font-size:16px; }
  .nav { display:flex; gap:4px; margin-left:auto; } .nav a { padding:7px 14px; border-radius:99px; color:var(--mute); text-decoration:none; font-size:14.5px; font-weight:600; }
  .nav a.on, .nav a:hover { background:var(--acc-soft); color:var(--acc-dark); }
  .langsw { display:inline-flex; background:var(--soft); border-radius:99px; padding:3px; margin-left:8px; } .langsw button { border:0; background:none; padding:5px 11px; border-radius:99px; font:inherit; font-size:13px; font-weight:700; color:var(--mute); cursor:pointer; } .langsw button.on { background:var(--acc); color:#fff; }
  .hero { background:linear-gradient(180deg,var(--soft),#fff); border-bottom:1px solid var(--line); }
  .hero-in { max-width:1120px; margin:0 auto; padding:34px 24px 22px; }
  h1 { font-size:36px; line-height:1.12; margin:0 0 8px; letter-spacing:-.8px; } h1 span { color:var(--acc); }
  .sub { color:var(--mute); font-size:15.5px; margin:0 0 18px; max-width:760px; }
  .qrow { display:flex; gap:10px; margin:0 0 12px; }
  .qrow input { flex:1; padding:15px 18px; font:inherit; font-size:17px; background:#fff; border:2px solid var(--line); border-radius:14px; color:var(--ink); }
  .qrow input:focus { outline:none; border-color:var(--acc); box-shadow:0 0 0 4px var(--acc-soft); }
  button.go { background:var(--acc); color:#fff; border:0; border-radius:14px; padding:0 30px; font:inherit; font-weight:700; font-size:16px; cursor:pointer; } button.go:hover { background:var(--acc-dark); }
  .tools { display:flex; flex-wrap:wrap; gap:10px 14px; align-items:center; }
  .seg { display:inline-flex; background:#fff; border:1px solid var(--line); border-radius:99px; padding:3px; }
  .seg label { padding:6px 14px; border-radius:99px; font-size:14px; font-weight:600; color:var(--mute); cursor:pointer; white-space:nowrap; }
  .seg input { display:none; } .seg label:has(input:checked) { background:var(--acc); color:#fff; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  label.chip { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border:1px solid var(--line); border-radius:99px; font-size:13.5px; font-weight:600; color:var(--mute); cursor:pointer; background:#fff; }
  label.chip input { display:none; } label.chip:has(input:checked) { background:var(--acc-soft); border-color:var(--acc); color:var(--acc-dark); }
  label.chip:has(input:checked)::before { content:"✓"; font-size:12px; }
  button.more { border:1px dashed var(--acc); background:#fff; color:var(--acc-dark); border-radius:99px; padding:6px 14px; font:inherit; font-size:13.5px; font-weight:700; cursor:pointer; }
  .wrap { max-width:1120px; margin:0 auto; padding:18px 24px 70px; }
  .note { border-radius:12px; padding:11px 16px; margin:12px 0; font-size:14.5px; }
  .warn { background:var(--warn-bg); color:var(--warn-ink); } .info { background:var(--info-bg); color:var(--info-ink); } .err { background:#FDE4E1; color:var(--bad); }
  .strip { font-size:13px; color:var(--mute); margin:0 0 10px; }
  details.ex { background:#fff; border:1px solid var(--line); border-radius:12px; margin:12px 0; }
  details.ex > summary { cursor:pointer; padding:10px 14px; font-size:14.5px; font-weight:600; color:var(--acc-dark); }
  .tabs { display:flex; gap:18px; padding:0 14px; border-bottom:1px solid var(--line); }
  .tab { background:none; border:0; padding:8px 2px; font:inherit; font-size:14.5px; color:var(--mute); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.on { color:var(--acc-dark); border-bottom-color:var(--acc); font-weight:700; }
  .exlist { max-height:300px; overflow:auto; padding:10px 14px; display:flex; flex-direction:column; gap:6px; }
  .exbtn { text-align:left; background:var(--soft); border:1px solid transparent; border-radius:10px; padding:7px 12px; font:inherit; font-size:14px; color:var(--ink); cursor:pointer; }
  .exbtn:hover { border-color:var(--acc); }
  .meta { color:var(--mute); font-size:13px; margin:10px 0; }
  .card { background:var(--card); border:1px solid var(--line); border-left:4px solid var(--acc); border-radius:14px; padding:16px 20px; margin:14px 0; transition:box-shadow .15s; }
  .card:hover { box-shadow:0 6px 22px rgba(91,75,255,.10); }
  .card h3 { font-size:17px; margin:0 0 4px; letter-spacing:-.2px; } .card .chips { color:var(--mute); font-size:13px; margin-bottom:8px; }
  .card p.body { margin:6px 0 10px; white-space:pre-wrap; }
  .actions { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .actions button { background:#fff; border:1px solid var(--line); border-radius:10px; padding:4px 12px; cursor:pointer; font-size:15px; }
  .actions a { color:var(--acc-dark); margin-left:auto; font-size:14px; font-weight:600; }
  details.full { margin-top:10px; } details.full summary { cursor:pointer; color:var(--acc-dark); font-size:14px; font-weight:600; }
  details.full pre { white-space:pre-wrap; font:14px/1.5 inherit; background:var(--soft); padding:10px 12px; border-radius:10px; max-height:420px; overflow:auto; }
  .cols { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; }
  .cols h3 { font-size:20px; margin:0 0 2px; } .cols ol { padding-left:20px; } .cols li { margin-bottom:10px; } .cols em { color:var(--mute); }
  button.tr { font:inherit; font-size:13px; font-weight:600; padding:6px 12px; margin:4px 0 8px; border:1px solid var(--acc); border-radius:99px; background:#fff; color:var(--acc-dark); cursor:pointer; } button.tr:hover { background:var(--acc-soft); } button.tr:disabled { opacity:.6; }
  mark.s { background:#D6E6FF; border-radius:3px; padding:0 2px; }
  mark.d { background:#FFE9A8; border-radius:3px; padding:0 2px; } mark.a { background:#C8F2E8; border-radius:3px; padding:0 2px; }
  table.regimes { width:100%; border-collapse:collapse; font-size:14px; } table.regimes th, table.regimes td { text-align:left; vertical-align:top; padding:9px 10px; border-bottom:1px solid var(--line); } table.regimes th { color:var(--mute); font-weight:700; }
  .facts { font-size:13px; color:var(--mute); margin:0 0 8px; } .legend { font-size:12px; color:var(--mute); margin:6px 0; }
  .scrim { position:fixed; inset:0; background:rgba(22,22,42,.35); opacity:0; pointer-events:none; transition:opacity .2s; z-index:40; } .scrim.on { opacity:1; pointer-events:auto; }
  .drawer { position:fixed; top:0; right:0; height:100vh; width:min(380px,92vw); background:#fff; z-index:50; transform:translateX(105%); transition:transform .25s; overflow-y:auto; padding:20px 22px 40px; box-shadow:-12px 0 40px rgba(22,22,42,.15); }
  .drawer.on { transform:none; }
  .drawer h2 { font-size:19px; margin:0 0 4px; display:flex; justify-content:space-between; align-items:center; } .drawer h2 button { border:0; background:var(--soft); width:32px; height:32px; border-radius:50%; font-size:16px; cursor:pointer; }
  .drawer h4 { margin:20px 0 8px; font-size:13px; text-transform:uppercase; letter-spacing:.6px; color:var(--mute); }
  .drawer label.row { display:flex; align-items:flex-start; gap:8px; margin:8px 0; cursor:pointer; font-size:14.5px; }
  .drawer input[type=checkbox] { accent-color:var(--acc); margin-top:4px; }
  .drawer select, .drawer input[type=number] { width:100%; padding:9px 11px; font:inherit; background:var(--soft); border:1px solid var(--line); border-radius:10px; color:var(--ink); }
  .drawer .field { margin:12px 0 4px; color:var(--mute); font-size:14px; } .drawer input[type=range] { width:100%; accent-color:var(--acc); }
  .years { display:flex; gap:8px; } .kinds { max-height:170px; overflow:auto; background:var(--soft); border-radius:10px; padding:4px 10px; }
  @media (max-width:760px) { h1 { font-size:27px; } .cols { grid-template-columns:1fr; } .qrow { flex-direction:column; } button.go { padding:13px; } }
</style>
</head>
<body data-title="site_title">
<header class="top"><div class="top-in">
  <a class="logo" href="/"><b>§</b>Zan Search</a>
  <nav class="nav"><a class="on" href="/" data-i18n="nav_search"></a><a href="/analytics" data-i18n="nav_analytics"></a></nav>
  <div class="langsw" role="group" data-i18n-aria="lang_label"></div>
</div></header>
<section class="hero"><div class="hero-in">
  <h1 data-i18n-html="h1"></h1>
  <p class="sub" data-i18n="sub"></p>
  <form class="qrow" id="form"><input id="q" autocomplete="off" data-i18n-ph="ph" data-i18n-aria="ph_label"><button class="go" type="submit" data-i18n="go"></button></form>
  <div class="tools">
    <div class="seg" role="radiogroup">
      <label data-i18n-title="hint_auto"><input type="radio" name="mode" value="auto" checked><span data-i18n="m_auto"></span></label>
      <label><input type="radio" name="mode" value="articles"><span data-i18n="m_articles"></span></label>
      <label><input type="radio" name="mode" value="titles"><span data-i18n="m_titles"></span></label>
      <label data-i18n-title="hint_regimes"><input type="radio" name="mode" value="regimes"><span data-i18n="m_regimes"></span></label>
      <label><input type="radio" name="mode" value="compare"><span data-i18n="m_compare"></span></label>
    </div>
    <div class="chips">
      <label class="chip"><input type="checkbox" id="only_in_force" checked><span data-i18n="c_inforce"></span></label>
      <label class="chip" data-i18n-title="hint_drafts"><input type="checkbox" id="hide_drafts" checked><span data-i18n="c_nodrafts"></span></label>
      <label class="chip"><input type="checkbox" id="hide_amending" checked><span data-i18n="c_noamend"></span></label>
      <label class="chip" data-i18n-title="hint_prior"><input type="checkbox" id="force_prior"><span data-i18n="c_prior"></span></label>
      <button class="more" type="button" id="open-more" data-i18n="more"></button>
    </div>
  </div>
</div></section>
<div class="wrap">
  <div class="note warn" data-i18n="warn"></div>
  <details class="ex" id="exbox"><summary id="exsummary"></summary>
    <div class="tabs" id="extabs"></div><div class="exlist" id="exlist"></div></details>
  <div id="out"></div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer">
  <h2><span data-i18n="drawer_title"></span> <button type="button" id="close-more" data-i18n-aria="close">✕</button></h2>
  <h4 data-i18n="d_search"></h4>
  <div class="field" data-i18n="d_method"></div>
  <select id="method"><option value="dense" data-i18n="o_dense"></option><option value="bm25" data-i18n="o_bm25"></option><option value="hybrid" data-i18n="o_hybrid"></option></select>
  <div class="field" id="klabel"></div><input type="range" id="k" min="3" max="20" value="8">
  <h4 data-i18n="d_filters"></h4>
  <label class="row" data-i18n-title="hint_unlinked"><input type="checkbox" id="include_unlinked" checked><span data-i18n="d_unlinked"></span></label>
  <div class="field" data-i18n="d_kinds"></div><div class="kinds" id="kinds"></div>
  <div class="field" data-i18n="d_years"></div><div class="years"><input type="number" id="year_from" value="1990" min="1900" max="2026"><input type="number" id="year_to" value="2026" min="1900" max="2026"></div>
  <h4 data-i18n="d_privacy"></h4>
  <label class="row" data-i18n-title="hint_consent"><input type="checkbox" id="consent"><span data-i18n="d_consent"></span></label>
</aside>
<script src="/static/i18n.js"></script>
<script>
const $ = s => document.querySelector(s);
const LANG = k => t('lang_' + k);
const MODES = ['auto', 'articles', 'titles', 'regimes', 'compare'];
const CMP = {'Смысловой (bge-m3)': 'o_dense', 'По словам (BM25)': 'o_bm25', 'Гибрид (смысл + слова)': 'o_hybrid'};
let KINDS = [], EXN = 0;
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; };
const mode = () => document.querySelector('input[name=mode]:checked').value;
const kinds = () => [...document.querySelectorAll('#kinds input:checked')].map(i => i.value);
const filters = () => ({only_in_force: $('#only_in_force').checked, hide_drafts: $('#hide_drafts').checked, hide_amending: $('#hide_amending').checked,
  include_unlinked: $('#include_unlinked').checked, kinds: kinds(), year_from: +$('#year_from').value || 1990, year_to: +$('#year_to').value || 2026,
  force_prior: $('#force_prior').checked ? 0.02 : 0});
const status = v => v === null ? t('st_unknown') : (v ? t('st_in') : t('st_out'));

function syncPanel() { $('#method').disabled = !['auto', 'articles'].includes(mode()); $('#klabel').textContent = t('d_k', $('#k').value); }
document.querySelectorAll('input[name=mode]').forEach(r => r.addEventListener('change', () => { syncPanel(); if ($('#q').value.trim()) run(); }));
$('#k').addEventListener('input', syncPanel);

async function post(url, body) {
  const r = await fetch(url, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)});
  return r.json();
}

function chips(parts) { return parts.filter(Boolean).join(' · '); }

// Deadlines (yellow) and amounts, percentages, penalties (green) are marked in the text; amounts in monthly calculation indices (МРП) are converted to tenge.
const DEADLINE = String.raw`(?:не\s+позднее|не\s+ранее|в\s+течение|в\s+срок\s+до|не\s+более|не\s+менее)?\s*\d+(?:\s*\([^)]{1,40}\))?\s+(?:календарн\p{L}+\s+|рабоч\p{L}+\s+)?(?:дн(?:ей|я|ь)|месяц\p{L}*|недел\p{L}*|лет|года|год|часов|часа|күн\p{L}*|ай(?:дан|ға|дың)?|жыл\p{L}*)`;
const AMOUNT = String.raw`\d+(?:[\s ]\d{3})*(?:[.,]\d+)?(?:\s*\([^)]{1,60}\))?\s*(?:МРП|месячн\p{L}+\s+расч[её]тн\p{L}+\s+показател\p{L}+|айлық\s+есептік\s+көрсеткіш\p{L}*|АЕК|процент\p{L}*|%|тенге|тыс\p{L}*\.?\s+тенге|ААЕ)`;
const FACTS = new RegExp(`(?<d>${DEADLINE})|(?<a>${AMOUNT})`, 'giu');
const MRP_RE = /(\d+(?:[\s ]\d{3})*(?:[.,]\d+)?)(?:\s*\([^)]{1,60}\))?\s*(?:МРП|месячн\p{L}+\s+расч[её]тн\p{L}+\s+показател\p{L}+|айлық\s+есептік\s+көрсеткіш\p{L}*|АЕК)/giu;
let MRP = null;
function marked(text) {
  const frag = document.createDocumentFragment(); let last = 0;
  for (const m of text.matchAll(FACTS)) {
    if (!m[0].trim()) continue;
    frag.appendChild(document.createTextNode(text.slice(last, m.index)));
    const mk = el('mark', m.groups.d ? 'd' : 'a', m[0]); mk.title = m.groups.d ? t('mark_d') : t('mark_a');
    frag.appendChild(mk); last = m.index + m[0].length;
  }
  frag.appendChild(document.createTextNode(text.slice(last)));
  return frag;
}
const nf = {format: n => numFmt().format(n)};
const NOTE_MAP = [['Надёжной статьи', 'n_lowconf'], ['Система справочная', 'n_policy'], ['BM25 ищет по словам', 'n_bm25en']];
function tn(n) {
  for (const [pre, key] of NOTE_MAP) if (n.startsWith(pre)) return t(key);
  const m = n.match(/^Запрос набран латиницей и прочитан как русский: «(.*)»\.$/); return m ? t('n_translit', m[1]) : n;
}
const ACTION = {'изменено': 'a_changed', 'дополнено': 'a_added', 'новая редакция': 'a_new', 'исключено': 'a_removed', 'өзгертілді': 'a_changed', 'толықтырылды': 'a_added', 'жаңа редакция': 'a_new', 'алып тасталды': 'a_removed'};
const EFFECT = [[/^с (\d\d\.\d\d\.\d{4})$/, {kk: m => m[1] + ' бастап', en: m => 'from ' + m[1]}], [/^через (\d+) календарных дней после первого официального опубликования$/, {kk: m => 'ресми жарияланған күннен кейін ' + m[1] + ' күнтізбелік күннен соң', en: m => m[1] + ' calendar days after first official publication'}],
  [/^порядок введения в действие определён отдельной статьёй закона$/, {kk: () => 'күшіне енгізу тәртібі заңның жеке бабында айқындалған', en: () => 'the order of entry into force is set by a separate article of the law'}],
  [/^после первого официального опубликования$/, {kk: () => 'алғашқы ресми жарияланғаннан кейін', en: () => 'after first official publication'}], [/^со дня первого официального опубликования$/, {kk: () => 'алғашқы ресми жарияланған күннен бастап', en: () => 'from the day of first official publication'}]];
function eff(s) {
  if (!s || UI === 'ru') return s;
  for (const [re, f] of EFFECT) { const m = s.match(re); if (m) return f[UI](m); }
  return s;
}
function mrpLine(text) {
  if (!MRP) return null;
  const seen = new Map();
  for (const m of text.matchAll(MRP_RE)) {
    const n = parseFloat(m[1].replace(/[\s ]/g, '').replace(',', '.'));
    if (isFinite(n) && !seen.has(n)) seen.set(n, `${nf.format(n)} ${t('mrp_unit')} ≈ ${nf.format(Math.round(n * MRP.value))} ₸`);
  }
  if (!seen.size) return null;
  const line = el('div', 'facts', [...seen.values()].slice(0, 6).join(' · ') + ' ' + t('mrp_line', nf.format(MRP.value), MRP.from));
  const a = el('a', '', t('mrp_source')); a.href = MRP.source; a.target = '_blank'; a.rel = 'noopener'; line.append(a, document.createTextNode('; ' + t('mrp_ref') + ')'));
  return line;
}
function articleCard(i, h, query, lang) {
  const c = el('div', 'card');
  c.appendChild(el('h3', '', `${i}. ${h.title} · ${t('art')} ${h.article_no}` + (h.heading ? ` — ${h.heading}` : '')));
  c.appendChild(el('div', 'chips', chips([kindName(h.kind), h.year, status(h.in_force), h.methods.length ? t('found') + ': ' + h.methods.join('+') : ''])));
  const body = el('p', 'body'); body.appendChild(marked(h.snippet)); c.appendChild(body);
  if (lang === 'en' && h.snippet_lang !== 'en') {
    const tb = el('button', 'tr', t('tr_btn')); tb.type = 'button';
    tb.onclick = async () => { tb.disabled = true; tb.textContent = '…'; const r = await post('/api/translate', {text: h.texts[h.snippet_lang] || h.snippet, src: h.snippet_lang, tgt: 'en'});
      const box = el('div', 'tr-out'); box.appendChild(el('div', 'meta', t('tr_meta', r.cut ? t('tr_cut') : ''))); box.appendChild(el('p', 'body', r.error ? r.error : r.text)); tb.replaceWith(box); };
    c.appendChild(tb);
  }
  const am = h.amendments || {history: [], pending: []};
  for (const p of am.pending.slice(0, 3)) {
    const text = p.status === 'upcoming' ? t('pend_upcoming', eff(p.effective) || '', p.note)
      : p.status === 'in_force_since_snapshot' ? t('pend_since', p.effective ? t('since_a', eff(p.effective)) : t('since_b'), p.note)
      : t('pend_unknown', p.note);
    c.appendChild(el('div', 'note warn', text.slice(0, 420)));
  }
  if (am.history.length) {
    const d = el('details', 'full'); d.appendChild(el('summary', '', t('hist', am.history.length)));
    const ul = el('ul', 'facts');
    for (const a of am.history) ul.appendChild(el('li', '', `${a.date} № ${a.number} — ${ACTION[a.action] ? t(ACTION[a.action]) : a.action}` + (a.effective ? ` (${eff(a.effective)})` : '')));
    d.appendChild(ul); d.appendChild(el('div', 'legend', t('hist_legend')));
    c.appendChild(d);
  }
  const ex = el('button', 'tr', t('key_btn')); ex.type = 'button';
  ex.onclick = async () => {
    const lg = h.snippet_lang, full = h.texts[lg] || ''; ex.disabled = true; ex.textContent = '…';
    const r = await post('/api/explain', {query, text: full});
    const box = el('div', 'tr-out'); box.appendChild(el('div', 'meta', t('key_meta')));
    const pre = c.querySelector('details.full pre');
    if (pre && r.sentences && r.sentences.length) {
      const f = document.createDocumentFragment(); let last = 0;
      for (const s of r.sentences) { f.appendChild(document.createTextNode(full.slice(last, s.start))); const mk = el('mark', 's', full.slice(s.start, s.end)); mk.title = t('closeness') + ' ' + s.score; f.appendChild(mk); last = s.end; }
      f.appendChild(document.createTextNode(full.slice(last))); pre.replaceChildren(f);
    }
    const ol = el('ol', 'facts'); (r.sentences || []).slice().sort((a, b) => b.score - a.score).forEach(s => ol.appendChild(el('li', '', `${s.score.toFixed(2)} — ${full.slice(s.start, s.end)}`)));
    box.appendChild(ol); ex.replaceWith(box);
  };
  c.appendChild(ex);
  const conv = mrpLine(h.texts.ru || h.texts.kk || h.snippet); if (conv) c.appendChild(conv);
  const act = el('div', 'actions');
  for (const [label, text, tip] of [['up', '👍', t('fb_up')], ['down', '👎', t('fb_down')]]) {
    const b = el('button', '', text); b.title = tip;
    b.onclick = async () => { const r = await post('/api/feedback', {query, title: h.title, article_no: h.article_no, label, consent: $('#consent').checked}); b.textContent = r.saved ? '✓' : '✗'; };
    act.appendChild(b);
  }
  if (h.url) { const a = el('a', '', t('open_act')); a.href = h.url; a.target = '_blank'; a.rel = 'noopener'; act.appendChild(a); }
  c.appendChild(act);
  const d = el('details', 'full'); d.appendChild(el('summary', '', t('full_text')));
  for (const [lg, name] of [['ru', 'русский'], ['kk', 'қазақша']]) if (h.texts[lg]) { d.appendChild(el('b', '', name)); const pre = el('pre'); pre.appendChild(marked(h.texts[lg])); d.appendChild(pre); }
  c.appendChild(d);
  return c;
}

async function run() {
  const query = $('#q').value.trim(), m = mode();
  const out = $('#out');
  if (!query) { out.replaceChildren(el('div', 'note info', t('empty_prompt'))); return; }
  out.replaceChildren(el('div', 'note info', t('searching')));
  history.replaceState(null, '', '?q=' + encodeURIComponent(query) + '&mode=' + m);
  const res = await post('/api/search', {query, mode: m, method: $('#method').value, k: +$('#k').value, filters: filters()});
  const frag = document.createDocumentFragment();
  if (res.error) { frag.appendChild(el('div', 'note err', t('err_search', res.error))); }
  else if (res.mode === 'titles') {
    if (res.routed) frag.appendChild(el('div', 'note info', t('routed')));
    frag.appendChild(el('div', 'meta', t('meta_short', LANG(res.lang), res.seconds.toFixed(2))));
    res.results.forEach((r, i) => {
      const c = el('div', 'card'); c.appendChild(el('h3', '', `${i + 1}. ${r.title}`));
      if (r.title_kk) c.appendChild(el('div', 'chips', r.title_kk));
      c.appendChild(el('div', 'chips', chips([kindName(r.kind), r.year, r.in_force ? t('st_in') : t('st_out')])));
      if (r.url) { const a = el('a', '', t('open_act')); a.href = r.url; a.target = '_blank'; a.rel = 'noopener'; c.appendChild(a); }
      frag.appendChild(c);
    });
    if (!res.results.length) frag.appendChild(el('div', 'note info', t('nothing')));
  } else if (res.mode === 'regimes') {
    frag.appendChild(el('div', 'meta', t('meta_short', LANG(res.lang), res.seconds.toFixed(2))));
    frag.appendChild(el('div', 'note info', t('regimes_note')));
    res.notes.forEach(n => frag.appendChild(el('div', res.low_confidence && n.startsWith('Надёжной') ? 'note warn' : 'note info', tn(n))));
    const tb = el('table', 'regimes'); const head = el('tr'); ['th_act', 'th_art', 'th_says', 'th_more'].forEach(k => head.appendChild(el('th', '', t(k)))); tb.appendChild(head);
    for (const r of res.rows) {
      const tr = el('tr'); const a = el('td'); const strong = el('b', '', r.title); a.appendChild(strong); a.appendChild(el('div', 'chips', chips([kindName(r.kind), r.year, status(r.in_force)])));
      if (r.url) { const l = el('a', '', 'adilet.zan.kz'); l.href = r.url; l.target = '_blank'; l.rel = 'noopener'; a.appendChild(l); }
      const art = el('td', '', `${t('art')} ${r.article_no}` + (r.heading ? ` — ${r.heading}` : ''));
      const body = el('td'); body.appendChild(marked(r.snippet.slice(0, 380) + (r.snippet.length > 380 ? '…' : '')));
      const conv = mrpLine(r.snippet); if (conv) body.appendChild(conv);
      tr.append(a, art, body, el('td', '', r.also ? `+${r.also}` : '—')); tb.appendChild(tr);
    }
    frag.appendChild(tb);
    if (!res.rows.length) frag.appendChild(el('div', 'note info', t('nothing')));
  } else if (res.mode === 'compare') {
    const cols = el('div', 'cols');
    res.columns.forEach(col => {
      const d = el('div'); d.appendChild(el('h3', '', CMP[col.label] ? t(CMP[col.label]) : col.label)); d.appendChild(el('div', 'meta', col.seconds.toFixed(2) + ' ' + (UI === 'ru' ? 'с' : 's')));
      col.notes.forEach(n => d.appendChild(el('div', 'meta', tn(n))));
      const ol = el('ol'); col.hits.forEach(h => { const li = el('li'); li.appendChild(el('b', '', `${h.title}, ${t('art')} ${h.article_no}`)); li.appendChild(el('br')); li.appendChild(el('em', '', h.heading)); ol.appendChild(li); });
      d.appendChild(ol); cols.appendChild(d);
    });
    frag.appendChild(cols);
  } else {
    frag.appendChild(el('div', 'meta', t('meta_art', LANG(res.lang), nf.format(res.searched), res.seconds.toFixed(2))));
    if (res.hits.length) frag.appendChild(el('div', 'legend', t('legend_marks')));
    if (res.direct) frag.appendChild(el('div', 'note info', t('direct')));
    res.notes.forEach(n => frag.appendChild(el('div', res.low_confidence && n.startsWith('Надёжной') ? 'note warn' : 'note info', tn(n))));
    if (res.hits.length && !res.low_confidence) {
      const sb = el('button', 'tr', t('sum_btn')); sb.type = 'button';
      sb.onclick = async () => {
        sb.disabled = true; sb.textContent = '…'; const box = el('div', 'card'); box.appendChild(el('h3', '', t('sum_title')));
        const ul = el('ul');
        for (const h of res.hits.slice(0, 3)) {
          const full = h.texts[h.snippet_lang] || ''; const r = await post('/api/explain', {query, text: full, k: 1});
          const s = (r.sentences || [])[0]; if (!s) continue;
          const li = el('li'); li.appendChild(el('span', '', '«')); li.appendChild(marked(full.slice(s.start, s.end))); li.appendChild(el('span', '', `» — ${h.title}, ${t('art')} ${h.article_no}`)); ul.appendChild(li);
        }
        box.appendChild(ul); box.appendChild(el('div', 'legend', t('sum_legend')));
        sb.replaceWith(box);
      };
      frag.appendChild(sb);
      const ab = el('button', 'tr', t('ans_btn')); ab.type = 'button'; ab.style.marginLeft = '8px';
      ab.onclick = async () => {
        ab.disabled = true; ab.textContent = t('ans_wait');
        const r = await post('/api/answer', {query, filters: filters()});
        const box = el('div', 'card'); box.appendChild(el('h3', '', t('ans_title')));
        if (r.status === 'ok') {
          const p = el('p', 'body'); r.sentences.filter(s => s.ok).forEach(s => p.appendChild(document.createTextNode(s.text + ' '))); box.appendChild(p);
          const sup = el('details', 'full'); sup.appendChild(el('summary', '', t('ans_support')));
          const ul0 = el('ul', 'facts'); r.sentences.filter(s => s.ok).forEach(s => ul0.appendChild(el('li', '', `${s.text.replace(/\[[\d,\s]+\]/g, '').trim().slice(0, 90)}… → «${s.support_quote}» (${t('ans_closeness', s.support)})`))); sup.appendChild(ul0); box.appendChild(sup);
          const src = el('div', 'facts', t('ans_sources', r.excerpts.map(e => `[${e.n}] ${e.title}, ${t('art')} ${e.article_no}`).join('; '))); box.appendChild(src);
          if (r.dropped) box.appendChild(el('div', 'legend', t('ans_dropped', r.dropped)));
        } else if (r.status === 'abstain') box.appendChild(el('p', 'body', t('ans_abstain')));
        else if (r.status === 'unverified') box.appendChild(el('p', 'body', t('ans_unverified')));
        else if (r.status === 'no_reliable_article') box.appendChild(el('p', 'body', t('ans_noreliable')));
        else box.appendChild(el('p', 'body', r.error || t('ans_error')));
        box.appendChild(el('div', 'legend', t('ans_foot', r.model || t('ans_local'))));
        ab.replaceWith(box);
      };
      frag.appendChild(ab);
    }
    res.hits.forEach((h, i) => frag.appendChild(articleCard(i + 1, h, query, res.lang)));
    if (!res.hits.length && !res.notes.length) frag.appendChild(el('div', 'note info', t('nothing')));
  }
  out.replaceChildren(frag);
}
$('#form').addEventListener('submit', e => { e.preventDefault(); run(); });

function buildKinds() {
  const on = new Set(kinds());
  $('#kinds').replaceChildren(...KINDS.map(k => { const l = el('label', 'row'); const i = el('input'); i.type = 'checkbox'; i.value = k; i.checked = on.has(k); l.append(i, document.createTextNode(kindName(k))); return l; }));
}
function relabel() { syncPanel(); buildKinds(); if (EXN) $('#exsummary').textContent = t('ex_sum', EXN); if ($('#q').value.trim()) run(); else $('#out').replaceChildren(el('div', 'note info', t('empty_prompt'))); }
async function init() {
  const ex = await (await fetch('/api/examples')).json();
  const names = {ru: 'Русский', kk: 'Қазақша', en: 'English'};
  const tabs = $('#extabs'), list = $('#exlist');
  EXN = (ex.ru || []).length; $('#exsummary').textContent = t('ex_sum', EXN);
  const show = lang => {
    tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', t.dataset.lang === lang));
    list.replaceChildren(...(ex[lang] || []).map(text => { const b = el('button', 'exbtn', text); b.type = 'button'; b.onclick = () => { $('#q').value = text; run(); }; return b; }));
  };
  for (const lang of ['ru', 'kk', 'en']) { const t = el('button', 'tab', names[lang]); t.type = 'button'; t.dataset.lang = lang; t.onclick = () => show(lang); tabs.appendChild(t); }
  show('ru');
  try { MRP = (await (await fetch('/api/config')).json()).mrp; } catch (e) { MRP = null; }
  const ks = await (await fetch('/api/kinds')).json();
  KINDS = ks; buildKinds();
  const p = new URLSearchParams(location.search);
  if (MODES.includes(p.get('mode'))) document.querySelector(`input[name=mode][value=${p.get('mode')}]`).checked = true;
  syncPanel();
  if (p.get('q')) { $('#q').value = p.get('q'); run(); } else $('#out').replaceChildren(el('div', 'note info', t('empty_prompt')));
}
const drawer = $('#drawer'), scrim = $('#scrim');
const setDrawer = on => { drawer.classList.toggle('on', on); scrim.classList.toggle('on', on); };
$('#open-more').onclick = () => setDrawer(true); $('#close-more').onclick = () => setDrawer(false); scrim.onclick = () => setDrawer(false);
document.addEventListener('keydown', e => { if (e.key === 'Escape') setDrawer(false); });
langSwitcher(relabel);
init();
</script>
